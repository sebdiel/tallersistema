# Despliegue de producción en el VPS (Iteración 4).
#
#   cp .env.prod.example .env.prod     # completar valores
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Ver DEPLOY.md para la guía completa.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taller
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env.prod}
      POSTGRES_DB: taller_db
      TZ: America/La_Paz
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taller -d taller_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sin "ports": la base de datos NO queda expuesta a internet.

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      CORS_ORIGIN: https://${DOMAIN}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: taller
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: taller_db
      # Producción: esquema solo por migraciones (se aplican al arrancar).
      DB_SYNC: "false"
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env.prod}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      # Sin taller de demostración: solo se crea el SUPERADMIN.
      SEED_DEMO: "false"
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:?Defina SEED_SUPERADMIN_EMAIL}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:?Defina SEED_SUPERADMIN_PASSWORD}
      PRECIO_SUSCRIPCION: ${PRECIO_SUSCRIPCION:-90}
      TZ: America/La_Paz
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN en .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data # certificados HTTPS
      - caddy_config:/config
    depends_on:
      - backend

  # Copia de seguridad diaria de la base de datos (se conservan N días).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: taller
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: taller_db
      RETENCION_DIAS: ${BACKUP_RETENCION_DIAS:-14}
      TZ: America/La_Paz
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
