services:
  db:
    image: postgres:16-alpine
    container_name: taller_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taller
      POSTGRES_PASSWORD: taller123
      POSTGRES_DB: taller_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
